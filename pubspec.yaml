name: shopsphere
description: Production-Level E-Commerce App using Clean Architecture.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # =========================
  # State Management
  # =========================
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # =========================
  # Networking
  # =========================
  dio: ^5.10.0
  retrofit: ^4.9.2
  pretty_dio_logger: ^1.4.0

  # =========================
  # JSON Serialization
  # =========================
  json_annotation: ^4.9.0

  # =========================
  # Dependency Injection
  # =========================
  get_it: ^9.2.1

  # =========================
  # Routing
  # =========================
  go_router: ^17.2.3

  # =========================
  # Local Storage
  # =========================
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # =========================
  # UI
  # =========================
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.1
  shimmer: ^3.0.0

  # =========================
  # Utilities
  # =========================
  intl: ^0.20.2
  logger: ^2.6.1
  connectivity_plus: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  build_runner: ^2.7.1
  json_serializable: ^6.11.0
  retrofit_generator: ^10.0.1
  mocktail: ^1.0.5
